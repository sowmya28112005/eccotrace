<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – EcoTrace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5faf7;--bg2:#eaf4ee;--white:#fff;--ink:#0f1f17;--ink2:#2a3d32;--muted:#6b7f73;--muted2:#a8bdb3;--green:#1a6b42;--green-mid:#228a56;--green-light:#45b872;--green-pale:#c4ead5;--green-bg:#edfaf3;--accent:#e05a5a;--border:#d8e8df;--border2:#bdd4c6;--shadow:0 2px 10px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.05);}
    [data-theme="dark"]{--bg:#0c1810;--bg2:#111f16;--white:#192a1f;--ink:#e6f5ec;--ink2:#b8d4c4;--muted:#6e9880;--muted2:#3d5a48;--green:#45b872;--green-mid:#38a062;--green-light:#65cc8e;--green-pale:#162e20;--green-bg:#0e2218;--accent:#f07070;--border:#1e3526;--border2:#274535;--shadow:0 2px 10px rgba(0,0,0,.3),0 8px 32px rgba(0,0,0,.25);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}

    /* NAV */
    nav{display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;transition:background .3s;}
    [data-theme="dark"] nav{background:rgba(12,24,16,.93);}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--green);letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:.55rem;}
    .logo-mark{width:32px;height:32px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:.9rem;font-weight:800;}
    .nav-right{display:flex;align-items:center;gap:.8rem;}
    .nav-link{font-size:.875rem;color:var(--muted);text-decoration:none;font-weight:500;transition:color .2s;}
    .nav-link:hover{color:var(--ink);}
    .theme-toggle{width:52px;height:28px;border-radius:100px;background:var(--border2);border:1px solid var(--border);cursor:pointer;position:relative;transition:background .3s;}
    [data-theme="dark"] .theme-toggle{background:var(--green);border-color:var(--green-mid);}
    .theme-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center;font-size:.65rem;line-height:1;}
    [data-theme="dark"] .theme-knob{transform:translateX(24px);}

    /* MAIN */
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;}
    .auth-wrap{width:100%;max-width:460px;}

    /* CARD */
    .auth-card{background:var(--white);border:1px solid var(--border);border-radius:24px;padding:2.5rem;box-shadow:var(--shadow);transition:background .3s,border-color .3s;}
    .card-header{text-align:center;margin-bottom:2rem;}
    .card-icon{width:58px;height:58px;background:var(--green-bg);border:1.5px solid var(--green-pale);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 1.1rem;}
    .card-title{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:-.04em;color:var(--ink);margin-bottom:.35rem;}
    .card-sub{color:var(--muted);font-size:.875rem;line-height:1.6;}

    /* FORM */
    .form-group{margin-bottom:1.1rem;}
    .form-label{display:block;font-size:.78rem;font-weight:600;color:var(--ink2);margin-bottom:.42rem;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;left:.92rem;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--muted2);pointer-events:none;line-height:1;}
    .form-input{width:100%;padding:.8rem .9rem .8rem 2.6rem;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;color:var(--ink);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s,background .2s,box-shadow .2s;}
    .form-input::placeholder{color:var(--muted2);}
    .form-input:focus{border-color:var(--green);background:var(--white);box-shadow:0 0 0 3px rgba(26,107,66,.1);}
    [data-theme="dark"] .form-input:focus{box-shadow:0 0 0 3px rgba(69,184,114,.15);}
    .form-input.error{border-color:var(--accent);}
    .pw-toggle{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;padding:.2rem;transition:color .2s;line-height:1;}
    .pw-toggle:hover{color:var(--ink);}
    .form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.3rem;margin-top:-.2rem;}
    .remember-wrap{display:flex;align-items:center;gap:.5rem;cursor:pointer;}
    .remember-wrap input[type="checkbox"]{width:15px;height:15px;accent-color:var(--green);}
    .remember-wrap span{font-size:.82rem;color:var(--muted);}
    .forgot-link{font-size:.82rem;color:var(--green);text-decoration:none;font-weight:600;transition:opacity .2s;}
    .forgot-link:hover{opacity:.75;}
    .error-msg{font-size:.74rem;color:var(--accent);margin-top:.32rem;display:none;align-items:center;gap:.3rem;}
    .error-msg.show{display:flex;}

    /* SUBMIT */
    .submit-btn{width:100%;padding:.92rem;border-radius:13px;background:var(--green);color:white;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:700;border:none;cursor:pointer;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.3rem;}
    .submit-btn:hover:not(:disabled){background:var(--green-mid);transform:translateY(-1px);box-shadow:0 6px 24px rgba(26,107,66,.28);}
    .submit-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
    .btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* DIVIDER & SOCIAL */
    .or-divider{display:flex;align-items:center;gap:.8rem;margin:1.3rem 0;color:var(--muted2);font-size:.8rem;}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .social-btns{display:flex;gap:.7rem;}
    .social-btn{flex:1;padding:.72rem;border-radius:11px;border:1.5px solid var(--border);background:var(--bg2);color:var(--ink2);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.45rem;transition:all .2s;}
    .social-btn:hover{border-color:var(--border2);background:var(--white);}

    /* FOOTER LINK */
    .card-footer{text-align:center;margin-top:1.6rem;font-size:.85rem;color:var(--muted);}
    .card-footer a{color:var(--green);font-weight:700;text-decoration:none;}
    .card-footer a:hover{opacity:.8;}

    /* PERKS */
    .perks-strip{display:flex;justify-content:center;gap:1.6rem;margin-top:1.8rem;flex-wrap:wrap;}
    .perk{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted);}
    .perk-icon{width:20px;height:20px;background:var(--green-bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.68rem;}

    /* TOAST */
    #toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);border-radius:12px;padding:.75rem 1.4rem;font-size:.875rem;box-shadow:var(--shadow);opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:480px){.auth-card{padding:1.8rem 1.4rem;}.social-btns{flex-direction:column;}}
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-mark">♻</div>
    EcoTrace
  </a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">Home</a>
    <a href="register.html" class="nav-link">Register</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <div class="theme-knob" id="themeKnob">☀</div>
    </button>
  </div>
</nav>

<main class="main">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="card-header">
        <div class="card-icon">🌱</div>
        <div class="card-title">Welcome back</div>
        <div class="card-sub">Log in to track your recycling impact and earn eco points</div>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="error-msg" id="emailErr">⚠ Please enter a valid email address</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle">👁</button>
          </div>
          <div class="error-msg" id="passErr">⚠ Password must be at least 6 characters</div>
        </div>

        <div class="form-row">
          <label class="remember-wrap">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <div class="btn-spinner" id="btnSpinner"></div>
          <span id="btnText">Log In →</span>
        </button>
      </form>

      <div class="or-divider">or continue with</div>
      <div class="social-btns">
        <button class="social-btn" onclick="socialLogin('Google')">
          <svg width="15" height="15" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="social-btn" onclick="socialLogin('GitHub')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.49 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.05.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.21.7.82.58C20.56 21.8 24 17.31 24 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
      </div>

      <div class="card-footer">Don't have an account? <a href="register.html">Create one free →</a></div>
    </div>

    <div class="perks-strip">
      <div class="perk"><div class="perk-icon">🔒</div> Secure login</div>
      <div class="perk"><div class="perk-icon">🌿</div> Track impact</div>
      <div class="perk"><div class="perk-icon">🏆</div> Earn rewards</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const API = 'http://localhost:5000/api';

/* THEME */
(function(){
  const t=localStorage.getItem('ecotrace_theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  const k=document.getElementById('themeKnob');
  if(k) k.textContent=t==='dark'?'☾':'☀';
})();
document.getElementById('themeToggle').addEventListener('click',function(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('ecotrace_theme',next);
  document.getElementById('themeKnob').textContent=next==='dark'?'☾':'☀';
});

/* PASSWORD TOGGLE */
document.getElementById('pwToggle').addEventListener('click',function(){
  const inp=document.getElementById('password');
  inp.type=inp.type==='password'?'text':'password';
  this.textContent=inp.type==='password'?'👁':'🙈';
});

/* FORM SUBMIT */
document.getElementById('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  let ok=true;
  document.querySelectorAll('.error-msg').forEach(m=>m.classList.remove('show'));
  document.querySelectorAll('.form-input').forEach(i=>i.classList.remove('error'));

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    document.getElementById('emailErr').classList.add('show');
    document.getElementById('email').classList.add('error');
    ok=false;
  }
  if(pass.length<6){
    document.getElementById('passErr').classList.add('show');
    document.getElementById('password').classList.add('error');
    ok=false;
  }
  if(!ok) return;

  const btn=document.getElementById('submitBtn');
  const spinner=document.getElementById('btnSpinner');
  const btnText=document.getElementById('btnText');
  btn.disabled=true; spinner.style.display='block'; btnText.textContent='Logging in…';

  try {
    const res=await fetch(`${API}/user/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const data=await res.json().catch(()=>({}));

    if(res.ok){
      /* ✅ Save user to localStorage */
      const user=data.user||{email};
      localStorage.setItem('ecotrace_user',JSON.stringify(user));
      toast('✅ Logged in! Redirecting…');
      setTimeout(()=>window.location.href='dashboard.html',1200);
    } else {
      toast('❌ '+(data.message||'Incorrect email or password.'));
      btn.disabled=false; spinner.style.display='none'; btnText.textContent='Log In →';
    }
  } catch(err){
    /* Offline fallback — check if any user with this email was registered locally */
    const stored=JSON.parse(localStorage.getItem('ecotrace_user')||'null');
    if(stored && stored.email===email){
      toast('✅ Logged in! (offline mode)');
      setTimeout(()=>window.location.href='dashboard.html',1200);
    } else {
      toast('❌ Server offline. Register first or check connection.');
      btn.disabled=false; spinner.style.display='none'; btnText.textContent='Log In →';
    }
  }
});

function socialLogin(p){ toast(`🔗 Connecting with ${p}…`); }

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3200);
}
</script>
</body>
</html>
